[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nothing-debug"
version = "0.1.0"
description = "Collega un portale Django alla dashboard di debug di Nothing Shell"
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]

[tool.setuptools.packages.find]
include = ["nothing_debug*"]
